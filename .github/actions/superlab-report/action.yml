name: Common Superlab research report qualification
description: Run pinned read-only central evidence gate, never approve trading.
inputs:
  report:
    required: true
    description: Source report path
  receipt:
    required: true
    description: Destination receipt JSON
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPORT: ${{ inputs.report }}
        RECEIPT: ${{ inputs.receipt }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$RECEIPT")"
        if ! test -f "$REPORT"; then
          printf '%s\n' '{"status":"SOURCE_REPORT_ABSENT","paper_approved":false,"live_allowed":false}' > "$RECEIPT"
          exit 0
        fi
        ROOT="$RUNNER_TEMP/eaverse-common-gate"
        PIN='9517b971e92b18cf551e61682825e9e25fa802c7'
        if ! test -d "$ROOT/.git"; then
          git init -q "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/evsayar33-oss/quant_superlab.git
          git -C "$ROOT" fetch -q --depth=1 origin "$PIN"
          git -C "$ROOT" checkout -q --detach FETCH_HEAD
        fi
        test "$(git -C "$ROOT" rev-parse HEAD)" = "$PIN"
        PYTHONPATH="$ROOT" python -m research.portfolio_qualification.eaverse_report_gate --input "$REPORT" --out "$RECEIPT"
