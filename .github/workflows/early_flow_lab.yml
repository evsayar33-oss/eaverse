name: Eaverse V5 hourly causal-flow intelligence (RESEARCH ONLY)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/early_flow_lab.yml
      - eaverse/early_flow.py
      - tests/test_early_flow.py
  pull_request:
    paths:
      - .github/workflows/early_flow_lab.yml
      - eaverse/early_flow.py
      - tests/test_early_flow.py
      - docs/EAVERSE_HOURLY_INTELLIGENCE_TR.md
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: early-flow-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-integrity-and-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify source integrity, source time, research gates, SHA chain and future-leakage controls
        run: |
          python -m unittest discover -s tests -p 'test_early_flow.py' -v
          python -m py_compile eaverse/early_flow.py

  genuine-historical-research:
    if: github.event_name != 'pull_request'
    needs: source-integrity-and-causality
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: write
    concurrency:
      group: eaverse-early-flow-${{ matrix.symbol }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore only this asset's append-only SHA-linked research summary
        shell: bash
        run: |
          set -euo pipefail
          SYMBOL="${{ matrix.symbol }}"
          B="research/eaverse-hourly-${SYMBOL,,}-evidence"
          ROOT="$RUNNER_TEMP/hourly-research-state"
          if git ls-remote --exit-code --heads origin "$B" >/dev/null 2>&1; then
            git fetch -q --depth=1 origin "refs/heads/$B"
            git worktree add --detach "$ROOT" FETCH_HEAD
          else
            git worktree add --detach "$ROOT" HEAD
          fi
          mkdir -p "$ROOT/observations/early_flow"
          echo "EARLY_FLOW_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "EARLY_FLOW_BRANCH=$B" >> "$GITHUB_ENV"
      - name: Fetch 24 original hourly archives + checksums and run 32 fixed experiments
        run: |
          set -euo pipefail
          python -m eaverse.early_flow --symbol "${{ matrix.symbol }}" \
            --ledger "$EARLY_FLOW_ROOT/observations/early_flow/summary.jsonl" \
            --out out/early_flow
          python - <<'PY'
          import json,os
          x=json.load(open("out/early_flow/report.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Eaverse genuine historical hourly, research only\n\n")
              f.write(f"{x['asset']}: {x['observed_hourly_bars']} authentic hourly bars; ")
              f.write(f"{x['source_months']} SHA-verified original monthly files; ")
              f.write(f"{x['experiment_count']} pre-specified experiments.\n\n")
              for status,count in sorted(x["counts_by_decision"].items()):
                  f.write(f"- {status}: {count}\n")
              f.write("\nNo valid historical observation is prospective first_seen. ")
              f.write("No PAPER/LIVE approval. Downside spot cannot be shorted by assumption.\n")
          PY
      - name: Commit ONLY source SHA and aggregated decisions to isolated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$EARLY_FLOW_ROOT"
          git -C "$ROOT" config user.name 'github-actions[bot]'
          git -C "$ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" add observations/early_flow/summary.jsonl
          if git -C "$ROOT" diff --cached --quiet; then
            echo 'NO_NEW_SOURCE_ARCHIVE_REVISION' >> "$GITHUB_STEP_SUMMARY"
          else
            git -C "$ROOT" commit -m "research(early-flow): SHA-verified retrospective decision summary [skip ci]"
            git -C "$ROOT" push origin "HEAD:refs/heads/$EARLY_FLOW_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eaverse-hourly-${{ matrix.symbol }}-${{ github.run_id }}
          path: out/early_flow/report.json
          retention-days: 90
          if-no-files-found: warn
