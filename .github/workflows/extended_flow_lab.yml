name: Eaverse V7 three-year multi-asset event-foundry (RESEARCH ONLY)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extended_flow_lab.yml'
      - 'eaverse/extended_flow.py'
      - 'eaverse/early_flow.py'
      - 'eaverse/source_council.py'
      - 'eaverse/cross_venue_reference.py'
      - 'tests/test_extended_flow.py'
      - 'tests/test_source_council.py'
      - 'tests/test_cross_venue_reference.py'
      - 'eaverse/statistical_audit.py'
      - 'tests/test_statistical_audit.py'
      - 'eaverse/empirical_trials.py'
      - 'tests/test_empirical_trials.py'
  pull_request:
    paths:
      - '.github/workflows/extended_flow_lab.yml'
      - 'eaverse/extended_flow.py'
      - 'eaverse/early_flow.py'
      - 'eaverse/source_council.py'
      - 'eaverse/cross_venue_reference.py'
      - 'tests/test_extended_flow.py'
      - 'tests/test_source_council.py'
      - 'tests/test_cross_venue_reference.py'
      - 'eaverse/statistical_audit.py'
      - 'tests/test_statistical_audit.py'
      - 'eaverse/empirical_trials.py'
      - 'tests/test_empirical_trials.py'
      - 'docs/EAVERSE_V7_RESEARCH_FOUNDRY_TR.md'
  schedule:
    - cron: '37 6 * * 2'

permissions:
  contents: read

concurrency:
  group: eaverse-v7-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test historical source, no-future-leakage and evidence chain
        run: |
          python -m unittest discover -s tests -p 'test_extended_flow.py' -v
          python -m unittest discover -s tests -p 'test_empirical_trials.py' -v
          python -m unittest discover -s tests -p 'test_source_council.py' -v
          python -m unittest discover -s tests -p 'test_cross_venue_reference.py' -v
          python -m py_compile eaverse/extended_flow.py eaverse/source_council.py eaverse/early_flow.py eaverse/cross_venue_reference.py
      - name: Export exactly classified cross-market research providers
        run: |
          python -m eaverse.source_council --out out/source_council
          cat out/source_council/sources.json > /dev/null
          echo "Source classification is a lead list, not full historical download or PAPER approval." >> "$GITHUB_STEP_SUMMARY"

      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  authenticated-archive-research:
    if: github.event_name != 'pull_request'
    needs: offline-research-contracts
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, BNBUSDT, ADAUSDT, LINKUSDT, AVAXUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: write
    concurrency:
      group: eaverse-v7-asset-${{ matrix.symbol }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore only this asset's append-only research evidence
        shell: bash
        run: |
          set -euo pipefail
          SYMBOL="${{ matrix.symbol }}"
          BRANCH="research/eaverse-v7-${SYMBOL,,}-evidence"
          ROOT="$RUNNER_TEMP/v7-research-evidence"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q --depth=1 origin "refs/heads/$BRANCH"
            git worktree add --detach "$ROOT" FETCH_HEAD
          else
            git worktree add --detach "$ROOT" HEAD
          fi
          mkdir -p "$ROOT/observations/extended_flow"
          echo "V7_EVIDENCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "V7_EVIDENCE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Download true 2023-25 hourly ZIPs, verify official checksums, test 64 frozen variants
        shell: bash
        run: |
          set -euo pipefail
          python -m eaverse.extended_flow --symbol "${{ matrix.symbol }}" \
            --ledger "$V7_EVIDENCE_ROOT/observations/extended_flow/studies.jsonl" \
            --statistical-ledger "$V7_EVIDENCE_ROOT/observations/extended_flow/statistical_trials.jsonl" \
            --out out/extended_flow
          python - <<'PY'
          import json, os
          x=json.load(open("out/extended_flow/report.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"### Eaverse V7: {x['symbol']}\n\n")
              f.write(f"Official SHA-verified monthly archives: {x['archive_months']}\n\n")
              f.write(f"Complete hourly observations: {x['hours']}; fixed hypotheses: {x['hypothesis_count']}\n\n")
              for name,count in sorted(x["decisions"].items()):
                  f.write(f"- {name}: {count}\n")
              f.write("\nNo historical replay is new prospective data, PAPER or LIVE authorization.\n")
          PY
      - name: Audit statistical limitations without inventing PBO or trading eligibility
        run: |
          python -m eaverse.statistical_audit \
            --report out/extended_flow/report.json \
            --out out/extended_flow/statistical_audit.json
          python - <<'PY'
          import json, os
          z=json.load(open("out/extended_flow/statistical_audit.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\nStatistical evidence: " + z["status"] +
                      "; missing proofs: " + str(len(z["missing_proofs"])) +
                      "; no PAPER/LIVE promotion.\n")
          PY
      - name: Verify source-aligned real statistical report is still research-only
        run: |
          python - <<'PY'
          import json, os
          base=json.load(open("out/extended_flow/report.json"))
          stats=json.load(open("out/extended_flow/statistical_trials.json"))
          assert stats["source_digest"] == base["source_digest"]
          assert stats["source_policy_sha256"] == base["policy_sha256"]
          assert stats["registered_long_trial_count"] == 32
          assert stats["paper_eligible"] is False and stats["live_allowed"] is False
          assert stats["untouched_holdout_read"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("Aligned costed weekly return paths: " +
                      str(len(stats["weekly_panel"]["dates_utc_week_end"])) + " weeks, " +
                      str(stats["registered_long_trial_count"]) +
                      " long trials. PBO: " + str(stats["pbo"].get("pbo")) +
                      "; DSR: " + str(stats["dsr"].get("dsr")) +
                      ". HISTORICAL RESEARCH ONLY; zero additional PAPER authority.\\n")
          PY
      - name: Persist complete aggregated source and strategy study, never vendor data
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$V7_EVIDENCE_ROOT"
          git -C "$ROOT" config user.name 'github-actions[bot]'
          git -C "$ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" add observations/extended_flow/studies.jsonl observations/extended_flow/statistical_trials.jsonl
          if git -C "$ROOT" diff --cached --quiet; then
            echo 'UNCHANGED_ARCHIVE_AND_POLICY_NO_NEW_EVIDENCE' >> "$GITHUB_STEP_SUMMARY"
          else
            git -C "$ROOT" commit -m "research(v7): append complete source-and-hypothesis evidence [skip ci]"
            git -C "$ROOT" push origin "HEAD:refs/heads/$V7_EVIDENCE_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eaverse-v7-${{ matrix.symbol }}-${{ github.run_id }}
          path: |
            out/extended_flow/report.json
            out/extended_flow/statistical_audit.json
            out/extended_flow/statistical_trials.json
          if-no-files-found: warn
          retention-days: 90


      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  cross-venue-usd-price-corrob:
    # Two independent USD venues are ONLY quality references, not a new
    # Binance USDT spot taker-flow backtest or trading price substitute.
    if: github.event_name != 'pull_request'
    needs: offline-research-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare completed Coinbase/Kraken BTC and ETH USD daily closes
        run: |
          python -m eaverse.cross_venue_reference --out out/cross_venue
          python - <<'PY'
          import json, os
          z=json.load(open("out/cross_venue/reference.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Coinbase/Kraken recent independent USD price source\n\n")
              for asset, row in sorted(z["sources"].items()):
                  f.write(f"- {asset}: {row['status']}; ")
                  f.write(f"overlapping complete days: {row.get('overlapping_completed_dates','UNVERIFIED')}\n")
              f.write("\nNeither Kraken nor Coinbase is a drop-in substitute for Binance taker-flow history. ")
              f.write("No PAPER/LIVE confirmation or full Kraken historical ZIP downloaded.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eaverse-v7-independent-reference-${{ github.run_id }}
          path: out/cross_venue/reference.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
