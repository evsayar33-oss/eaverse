name: Autonomous research

on:
  push:
    branches: [main]
    paths: [".github/bootstrap-research"]
  schedule:
    - cron: '43 4,18,22 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the initial research checkpoint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autonomous-research-state
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EAVERSE_BOOTSTRAP: ${{ (github.event_name == 'push' || inputs.bootstrap) && 'true' || 'false' }}
      EAVERSE_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore durable research state
        run: python -m eaverse.checkpoint restore
      - name: Discover, validate and advance PAPER simulations
        run: python -m eaverse.engine
      - name: Commit results before notification
        run: python -m eaverse.checkpoint save
      - name: Publish research summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: research-summary-${{ github.run_id }}
          path: runtime/report.json
          retention-days: 7
      - name: Deliver actionable notifications
        id: delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m eaverse.delivery
      - name: Save notification receipts
        if: always() && steps.delivery.outcome != 'skipped'
        run: python -m eaverse.checkpoint save
