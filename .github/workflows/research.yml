name: Autonomous research

on:
  push:
    branches: [main]
    paths: [".github/bootstrap-research"]
  schedule:
    - cron: '43 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the initial research checkpoint
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autonomous-research-state
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EAVERSE_BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
      EAVERSE_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore durable research state
        run: python -m eaverse.checkpoint restore
      - name: Discover, validate and advance PAPER simulations
        id: discover
        run: python -m eaverse.engine
      - name: Archive completed research groups
        id: archival
        continue-on-error: true
        run: python -m eaverse.archive
      - name: Commit results before notification
        id: research_checkpoint
        run: python -m eaverse.checkpoint save
      - name: Publish research summary
        if: always() && steps.discover.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: research-summary-${{ github.run_id }}
          path: |
            runtime/report.json
            runtime/event-daily.jsonl
          retention-days: 7
      - name: Preserve checkpoint for recovery after a publication failure
        if: always() && steps.research_checkpoint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-recovery-${{ github.run_id }}
          path: runtime/research.sqlite
          retention-days: 2
      - name: Publish PAPER dashboard snapshot
        id: paper_panel
        continue-on-error: true
        run: python -m eaverse.panel
      - name: Deliver actionable notifications
        id: delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m eaverse.delivery
      - name: Save notification receipts
        if: always() && steps.delivery.outcome != 'skipped'
        run: python -m eaverse.checkpoint save
      - name: Surface publication failure after saving state
        if: always() && (steps.archival.outcome == 'failure' || steps.paper_panel.outcome == 'failure')
        run: exit 1
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
