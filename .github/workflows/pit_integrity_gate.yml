name: Eaverse V9 PIT integrity and sealed research eligibility (NO ORDERS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eaverse/research_integrity.py'
      - 'eaverse/oos_prospective.py'
      - 'eaverse/integrity_audit.py'
      - 'eaverse/causal_discovery.py'
      - 'tests/test_research_integrity.py'
      - '.github/workflows/pit_integrity_gate.yml'
  push:
    branches: [main]
    paths:
      - 'eaverse/research_integrity.py'
      - 'eaverse/oos_prospective.py'
      - 'eaverse/integrity_audit.py'
      - 'eaverse/causal_discovery.py'
      - 'tests/test_research_integrity.py'
      - '.github/workflows/pit_integrity_gate.yml'
  schedule:
    - cron: '27 6 * * 2'

permissions:
  contents: read

jobs:
  pit-integrity-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Adversarial source, L2, identity, vintage and OOS/forward regression
        run: python -m unittest discover -s tests -p 'test_research_integrity.py' -v
      - name: Verify original V8 queue and 148 independent registrations
        run: python -m unittest discover -s tests -p 'test_causal_discovery.py' -v
      - name: Audit missing real PIT evidence without inventing observations
        run: python -m eaverse.integrity_audit --out out/pit_integrity/audit.json
      - name: Require no unverified candidate is considered qualified
        run: |
          python - <<'PY'
          import json
          p=json.load(open('out/pit_integrity/audit.json'))
          assert p['hypothesis_count']==148
          assert p['blocked']==148
          assert p['structural_research_ready']==0
          assert p['paper_eligible']==0
          assert p['live_authorized'] is False
          assert p['real_profit_not_inferred_from_source_readiness'] is True
          print('FAIL_CLOSED_148_NO_PAPER_NO_LIVE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eaverse-v9-source-integrity-gate
          path: out/pit_integrity/audit.json
          retention-days: 90
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
